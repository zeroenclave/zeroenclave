name: Bug report
description: Something in the app does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please **do not attach private photos, your password or your recovery key**, and blur anything personal in screenshots.

        Security issues or a vault that no longer opens: do not file them here, see [SECURITY.md](https://github.com/zeroenclave/zeroenclave/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About, e.g. 2026.12.1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: iPhone 17 Pro, iOS 26.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Once
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or additional context
      description: Optional. No private photos.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: This is not a security issue and my data is not at risk.
          required: true
        - label: I searched the existing issues.
          required: true
